openapi: 3.0.3
info:
  title: Tsubuyaki Board API
  version: 1.0.0
paths:
  /api/posts:
    get:
      summary: 投稿一覧を取得する
      responses:
        "200":
          description: 投稿一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
components:
  schemas:
    Post:
      type: object
      required:
        - id
        - author
        - body
        - avatarColor
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        author:
          type: string
        body:
          type: string
        avatarColor:
          type: string
        createdAt:
          type: string
          format: date-time
