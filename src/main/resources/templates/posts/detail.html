<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投稿詳細 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>投稿詳細</h1>
    <nav>
        <a th:href="@{/posts}">一覧に戻る</a>
    </nav>

    <article class="post">
        <header>
            <span class="post__avatar"
                  th:classappend="'post__avatar--' + ${post.avatarColor}"
                  th:attr="aria-label=${post.avatarColor}"></span>
            <span class="post__author" th:text="${post.author}">投稿者</span>
        </header>
        <p class="post__body" th:text="${post.body}">本文</p>
        <img class="post__image"
             th:if="${post.hasImage()}"
             th:src="${post.imageDataUri}"
             alt="添付画像">
        <footer class="post__footer">
            <time class="post__created-at"
                  th:datetime="${post.createdAt}"
                  th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</time>
            <form class="post__delete-form" th:action="@{/posts/{id}/delete(id=${post.id})}" method="post">
                <button class="post__delete-button" type="submit">削除</button>
            </form>
        </footer>
    </article>
    <section class="like-panel">
        <form th:action="@{/posts/{id}/likes(id=${post.id})}" method="post">
            <button class="like-button"
                    th:classappend="${liked} ? 'like-button--liked' : ''"
                    type="submit"
                    th:text="${(liked ? '♥' : '♡') + likeCount}">♡0</button>
        </form>
        <span class="comment-count" th:text="${'💬' + commentCount}">💬0</span>
    </section>

    <section class="comment-form-panel">
        <form th:action="@{/posts/{id}/comments(id=${post.id})}" th:object="${commentForm}" method="post">
            <div>
                <label for="commentAuthor">投稿者</label>
                <input type="text" id="commentAuthor" th:field="*{author}" maxlength="30">
                <p class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">エラー</p>
            </div>
            <div>
                <label for="commentBody">コメント</label>
                <textarea id="commentBody" th:field="*{body}" maxlength="280" rows="3"></textarea>
                <p class="error" th:if="${#fields.hasErrors('body')}" th:errors="*{body}">エラー</p>
            </div>
            <button type="submit">コメント</button>
        </form>
    </section>

    <section class="comments">
        <h2>コメント</h2>
        <p class="comments__empty" th:if="${#lists.isEmpty(comments)}">まだコメントはありません</p>
        <article class="comment" th:each="comment : ${comments}">
            <header>
                <span class="comment__author" th:text="${comment.author}">投稿者</span>
                <time class="comment__created-at"
                      th:datetime="${comment.createdAt}"
                      th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</time>
            </header>
            <p class="comment__body" th:text="${comment.body}">コメント本文</p>
        </article>
    </section>
</main>
</body>
</html>
