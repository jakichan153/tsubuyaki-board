<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投稿詳細 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>投稿詳細</h1>
    <nav>
        <a th:href="@{/posts}">一覧に戻る</a>
    </nav>

    <article class="post">
        <header>
            <span class="post__avatar"
                  th:classappend="'post__avatar--' + ${post.avatarColor}"
                  th:attr="aria-label=${post.avatarColor}"></span>
            <span class="post__author" th:text="${post.author}">投稿者</span>
        </header>
        <p class="post__body" th:text="${post.body}">本文</p>
        <footer>
            <time class="post__created-at"
                  th:datetime="${post.createdAt}"
                  th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</time>
        </footer>
    </article>
    <section class="like-panel">
        <p>
            いいね数
            <span th:text="${likeCount}">0</span>
        </p>
        <form th:action="@{/posts/{id}/likes(id=${post.id})}" method="post">
            <button type="submit">Like</button>
        </form>
    </section>
</main>
</body>
</html>
